<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Lexus Representações</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#161b1e;--bg1:#1e2428;--bg2:#242b30;--bg3:#2c343a;--bg4:#323d44;
  --b1:#2e373e;--b2:#3d484f;--b3:#4a5760;
  --cr:#e8e4d4;--cr2:#ccc7b4;--cr3:#9a9485;--cr4:#63594e;
  --go:#c9a84c;--go2:#e0bc65;--go4:rgba(201,168,76,.12);
  --gn:#4fb87a;--gn2:rgba(79,184,122,.1);
  --rd:#c96060;--rd2:rgba(201,96,96,.1);
  --sw:258px;
  --ff:'DM Sans',system-ui,sans-serif;
  --fd:'Cormorant Garamond',Georgia,serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg0);color:var(--cr);font-family:var(--ff);overflow-x:hidden;height:100vh;display:flex}
.sidebar{width:var(--sw);background:var(--bg1);height:100vh;position:fixed;left:0;top:0;border-right:1px solid var(--b1);z-index:100}
.sidebar-logo{padding:40px 30px;text-align:center}
.sidebar-logo h1{font-family:var(--fd);font-size:32px;letter-spacing:3px;color:var(--go);text-transform:uppercase}
.nav-list{list-style:none;padding:0 15px}
.nav-item{padding:14px 20px;margin-bottom:6px;border-radius:12px;cursor:pointer;display:flex;align-items:center;gap:15px;color:var(--cr3);transition:all .2s;font-weight:500}
.nav-item:hover{background:var(--bg2);color:var(--go)}
.nav-item.active{background:var(--go);color:var(--bg0);box-shadow:0 10px 20px rgba(201,168,76,.2)}
.main{margin-left:var(--sw);padding:40px;flex:1;min-height:100vh}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:40px}
.top-bar h2{font-family:var(--fd);font-size:32px;font-weight:600}
.card{background:var(--bg1);border-radius:24px;padding:30px;border:1px solid var(--b1);box-shadow:0 15px 35px rgba(0,0,0,.2)}
.grid-dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:25px;margin-bottom:40px}
.stat-card{background:var(--bg1);padding:30px;border-radius:24px;border:1px solid var(--b1);position:relative;overflow:hidden}
.stat-label{color:var(--cr3);font-size:14px;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;display:block}
.stat-value{font-family:var(--fd);font-size:36px;color:var(--go);font-weight:700}
.btn-primary{background:var(--go);color:var(--bg0);padding:14px 28px;border-radius:12px;border:none;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:10px}
table{width:100%;border-collapse:collapse;margin-top:20px}
th{text-align:left;padding:18px;color:var(--cr3);font-size:12px;text-transform:uppercase;border-bottom:1px solid var(--b2)}
td{padding:18px;border-bottom:1px solid var(--b1);font-size:14px;color:var(--cr2)}
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-logo"><h1>Lexus</h1></div>
  <ul class="nav-list">
    <li class="nav-item active" onclick="showPage('dash')">Dashboard</li>
    <li class="nav-item" onclick="showPage('pedidos')">Pedidos</li>
    <li class="nav-item" onclick="showPage('estoque')">Estoque</li>
    <li class="nav-item" onclick="showPage('clientes')">Clientes</li>
    <li class="nav-item" onclick="showPage('financeiro')">Financeiro</li>
  </ul>
</div>

<div class="main">
  <div id="page-content"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// CONFIGURAÇÃO CONECTADA AO SEU SUPABASE ngnchrasfwytlsoqxbgd
const SUPABASE_URL = 'https://ngnchrasfwytlsoqxbgd.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5nbmNocmFzZnd5dGxzb3F4YmdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4MjQ0MTQsImV4cCI6MjA5MzQwMDQxNH0.dQq9keo5iQ4DWxjASTAmsDlTqvFMdVj0XdZZRyr2q-4';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function showPage(page) {
  const content = document.getElementById('page-content');
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
  
  if(page === 'dash') {
    content.innerHTML = `
      <div class="top-bar"><h2>Dashboard Lexus Pro</h2></div>
      <div class="grid-dash">
        <div class="stat-card"><span class="stat-label">Vendas Mês</span><div class="stat-value">R$ 15.780</div></div>
        <div class="stat-card"><span class="stat-label">Pedidos Ativos</span><div class="stat-value">14</div></div>
        <div class="stat-card"><span class="stat-label">Saldo em Caixa</span><div class="stat-value">R$ 42.100</div></div>
      </div>
      <div class="card"><canvas id="mainChart" height="100"></canvas></div>`;
    renderChart();
  }

  if(page === 'estoque') {
    content.innerHTML = `<div class="top-bar"><h2>Estoque</h2><button class="btn-primary">+ Novo Produto</button></div>
    <div class="card"><table><thead><tr><th>Item</th><th>Qtd</th><th>Preço</th></tr></thead><tbody id="lista-estoque"></tbody></table></div>`;
    const { data } = await _supabase.from('estoque').select('*');
    if(data) {
      document.getElementById('lista-estoque').innerHTML = data.map(i => `<tr><td>${i.nome}</td><td>${i.qtd}</td><td>R$ ${i.preco}</td></tr>`).join('');
    }
  }

  if(page === 'clientes') {
    content.innerHTML = `<div class="top-bar"><h2>Clientes</h2><button class="btn-primary">+ Novo Cliente</button></div>
    <div class="card"><table><thead><tr><th>Nome</th><th>Cidade</th></tr></thead><tbody id="lista-clientes"></tbody></table></div>`;
    const { data } = await _supabase.from('clientes').select('*');
    if(data) {
      document.getElementById('lista-clientes').innerHTML = data.map(c => `<tr><td>${c.nome}</td><td>${c.cidade}</td></tr>`).join('');
    }
  }
}

function renderChart() {
  const ctx = document.getElementById('mainChart').getContext('2d');
  new Chart(ctx, {
    type: 'line',
    data: {
      labels: ['Seg','Ter','Qua','Qui','Sex'],
      datasets: [{ label: 'Vendas', data: [5, 12, 8, 15, 25], borderColor: '#c9a84c', tension: 0.4 }]
    },
    options: { plugins: { legend: { display: false } } }
  });
}

showPage('dash');
</script>
</body>
</html>
